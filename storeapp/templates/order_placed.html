{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>Order placed — STEPSAURA</title>
  <link rel="stylesheet" href="{% static 'css/order.css' %}">
</head>
<body>
  <main class="confirmation" aria-labelledby="page-title">
    <section class="card">
      <div class="success-art" role="img" aria-label="Order successfully placed">
        <svg class="success-mark" viewBox="0 0 140 140" aria-hidden="true">
          <circle class="success-ring" cx="70" cy="70" r="62" />
          <circle class="success-disc" cx="70" cy="70" r="36" />
          <path class="success-check" d="M55 70l10 10 22-23" />
        </svg>
      </div>

      <p class="eyebrow">ORDER CONFIRMED</p>
      <h1 id="page-title">Thank you!<br><em>Your order is placed.</em></h1>
    </section>
  </main>
</body>
</html>
