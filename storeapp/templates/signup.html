{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | BloomShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
  <header class="site-header">
    <nav class="navbar container py-3">
      <a class="navbar-brand fw-bold" href="/">BLOOM<span>SHOP</span></a>
      <a class="link-secondary text-decoration-none" href="/sign-in/">Already a member? <strong class="text-dark">Sign in</strong></a>
    </nav>
  </header>
  <main class="auth-main container py-5">
    <section class="auth-card mx-auto">
      <a class="auth-back" href="/">← Back to shop</a>
      <span class="eyebrow d-block mt-4">JOIN THE COMMUNITY</span>
      <h1 class="h2 fw-bold mt-2">Create your account</h1>
      <p class="text-secondary mb-4">Save your favorites and make checkout a little easier.</p>
      <form id="sign-up-form" class="auth-form">
        <label class="form-label" for="signup-name">Your name</label>
        <input class="form-control" id="signup-name" name="name" type="text" autocomplete="name" placeholder="Enter your name" required>
        <label class="form-label mt-3" for="signup-email">Email address</label>
        <input class="form-control" id="signup-email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
        <label class="form-label mt-3" for="signup-password">Password</label>
        <div class="password-field mt-3">
          <input class="form-control" id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
          <button class="password-toggle" type="button" data-toggle-password="signup-password" aria-label="Hold or focus to show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <label class="form-label mt-3" for="signup-confirm">Confirm password</label>
        <div class="password-field mt-3">
          <input class="form-control" id="signup-confirm" name="confirm-password" type="password" autocomplete="new-password" placeholder="Enter your password again" minlength="8" required>
          <button class="password-toggle" type="button" data-toggle-password="signup-confirm" aria-label="Hold or focus to show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="form-check mt-3">
          <input class="form-check-input" id="signup-updates" type="checkbox">
          <label class="form-check-label text-secondary" for="signup-updates">Send me occasional news and offers</label>
        </div>
        <button class="btn btn-warning rounded-pill w-100 mt-4 py-2" type="submit">Create account</button>
        <p class="auth-feedback small mt-3 mb-0" id="auth-feedback" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-note small text-center mt-4 mb-0">Demo storefront · account creation is not connected to a server.</p>
    </section>
  </main>
  <script src="{% static 'script/script.js' %}" defer></script>
</body>
</html>
