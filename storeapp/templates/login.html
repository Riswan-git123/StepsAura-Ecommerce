{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | BloomShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
  <header class="site-header">
    <nav class="navbar container py-3">
      <a class="navbar-brand fw-bold" href="/">BLOOM<span>SHOP</span></a>
    </nav>
  </header>
  <main class="auth-main container py-5">
    <section class="auth-card mx-auto">
      <a class="auth-back" href="/">← Back to shop</a>
      <span class="eyebrow d-block mt-4">WELCOME BACK</span>
      <h1 class="h2 fw-bold mt-2">Sign in to BloomShop</h1>
      <p class="text-secondary mb-4">Pick up where you left off and find your next favorite pair.</p>
      <form id="sign-in-form" class="auth-form" autocomplete="off">
        <label class="form-label" for="signin-email">Email address</label>
        <input class="form-control" id="signin-email" name="email" type="email" autocomplete="off" placeholder="Enter your email" required>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <label class="form-label mb-0" for="signin-password">Password</label>
        </div>
        <div class="password-field mt-2">
          <input class="form-control" id="signin-password" name="password" type="password" autocomplete="new-password" placeholder="Enter your password" minlength="6" required>
          <button class="password-toggle" type="button" data-toggle-password="signin-password" aria-label="Hold or focus to show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button class="btn btn-warning rounded-pill w-100 mt-4 py-2" type="submit">Sign in</button>
        <p class="auth-feedback small mt-3 mb-0" id="auth-feedback" role="status" aria-live="polite"></p>
      </form>
      <p class="text-center text-secondary mt-4 mb-0">Don’t have an account? <a class="auth-small-link fw-semibold" href="/sign-up/">Create account</a></p>
      <p class="auth-note small text-center mt-4 mb-0">Demo storefront · account access is not connected to a server.</p>
    </section>
  </main>
  <script src="{% static 'script/script.js' %}" defer></script>
</body>
</html>
