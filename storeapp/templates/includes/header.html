<header class="site-header sticky-top">
  <nav class="navbar navbar-expand-lg container py-3">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">STEPS<span>AURA</span></a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#mainNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-lg-4 me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
      </ul>

      <form class="d-flex my-3 my-lg-0 me-lg-3" role="search" onsubmit="return false">
        <input class="form-control rounded-pill" type="search"
          placeholder="Search products..." aria-label="Search products">
      </form>

      <a class="btn btn-outline-dark rounded-pill" href="{% url 'cart' %}">
        Cart <span class="badge text-bg-warning" id="cart_count">{{count}}</span>
      </a>

      <div class="ms-lg-3 mt-3 mt-lg-0">
        <a class="link-secondary me-2" href="{% url 'login' %}">Login</a>
        <a class="btn btn-sm btn-dark rounded-pill" href="{% url 'signup' %}">Sign up</a>
      </div>
    </div>
  </nav>
</header>
